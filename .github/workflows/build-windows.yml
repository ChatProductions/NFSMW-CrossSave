name: Build and release Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run offline sanity tests
        run: python self_test.py

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build portable Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --clean --name NFSMW-CrossSave-v1.0 --icon assets/crosssave.ico --add-data "assets;assets" converter_gui.pyw
          if (!(Test-Path "dist/NFSMW-CrossSave-v1.0.exe")) { throw "EXE not produced" }

      - name: Upload EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-CrossSave-v1.0-Windows
          path: dist/NFSMW-CrossSave-v1.0.exe
          if-no-files-found: error

      - name: Check if v1.0.0 release already exists
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseList = gh release list --repo "$env:GITHUB_REPOSITORY" --json tagName | ConvertFrom-Json
          if ($releaseList | Where-Object { $_.tagName -eq 'v1.0.0' }) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish first successful Windows build as v1.0.0
        if: steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: NFSMW CrossSave v1.0.0
          body: |
            PC ↔ GameCube (USA) conversion has been tested in-game with selected career saves.
            GameCube cross-region conversions are experimental and require real regional testing.
            Back up your save files and Dolphin memory card before use.
            Windows portable executable: no Python installation required.
          files: dist/NFSMW-CrossSave-v1.0.exe
          fail_on_unmatched_files: true
