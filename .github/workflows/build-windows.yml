name: Build CrossSave 0.7 preview
on:
  push:
    branches: [ps2-black-edition-v0.7-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python self_test.py
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --clean --name NFSMW-CrossSave-v0.7-preview --icon assets/crosssave.ico --add-data "assets;assets" converter_gui.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: NFSMW-CrossSave-v0.7-preview-Windows
          path: dist/NFSMW-CrossSave-v0.7-preview.exe
