name: Build and release Windows EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Python modules compile
        run: python -m py_compile converter_gui.pyw converter_core.py ps2_support.py ps2_layout.py

      - name: Run existing converter tests
        run: python self_test.py

      - name: Run PS2 Black Edition regression tests
        run: python -m unittest test_ps2 -v

      - name: Run GUI template and validation regression tests
        run: python -m unittest test_gui -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build portable Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --clean --name NFSMW-CrossSave-v0.7.4 --icon assets/crosssave.ico --add-data "assets;assets" converter_gui.pyw
          if (!(Test-Path "dist/NFSMW-CrossSave-v0.7.4.exe")) { throw "EXE not produced" }

      - name: Upload EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-CrossSave-v0.7.4-Windows
          path: dist/NFSMW-CrossSave-v0.7.4.exe
          if-no-files-found: error

      - name: Upload existing public neutral scaffold for temporary GC→Vita regression
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: crosssave-neutral-scaffold-review
          path: assets/pc_scaffold.z
          if-no-files-found: error

      - name: Publish experimental v0.7.4 Windows release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.4
          name: NFSMW CrossSave v0.7.4 - Donor-free Vita Raw Conversion
          prerelease: true
          generate_release_notes: false
          body: |
            This build extends v0.5, retaining its PC and GameCube conversion and
            experimental GameCube region-transfer support.

            PS2 Black Edition (SLUS-21351) support and hotfix:
            - Generates extensionless Vita raw saves without an external donor or template.
            - Uses the previously bundled sanitized PC scaffold and Vita-specific AA padding.
            - Keeps genuine Vita profile templates as optional compatibility inputs.
            - Allows source inspection without selecting the destination template.
            - Still uses a genuine destination-format save to preserve platform-only fields.
            - Rejects layout-invalid PS2-native game files, even if CRC/MD5 pass.
            - PS2 Vita raw, PS2 native 20CM, and PSU import.
            - PC <-> PS2 and GameCube <-> PS2 conversions.
            - Vita raw, PS2 native game file, and PSU output.
            - Vita raw output needs no destination save. Native PS2 file/PSU still need templates.
            - Complete PSU output requires an exported SLUS-21351 PSU for icon metadata.
            - Existing cash override, backups and verification remain.

            WARNING: PS2 conversion is structurally verified with real user
            examples but DONOR-FREE Vita output has NOT been tested in-game. v0.7.0 and v0.7.1 PS2 outputs
            should be regenerated with this fixed build. Make backups, and
            only test on copies. GameCube editions outside USA remain
            experimental. This is a prerelease.
          files: dist/NFSMW-CrossSave-v0.7.4.exe
          fail_on_unmatched_files: true
