name: Build and release Windows EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Python modules compile
        run: python -m py_compile converter_gui.pyw converter_core.py ps2_support.py

      - name: Run existing converter tests
        run: python self_test.py

      - name: Run PS2 Black Edition regression tests
        run: python -m unittest test_ps2 -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build portable Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --clean --name NFSMW-CrossSave-v0.7 --icon assets/crosssave.ico --add-data "assets;assets" converter_gui.pyw
          if (!(Test-Path "dist/NFSMW-CrossSave-v0.7.exe")) { throw "EXE not produced" }

      - name: Upload EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-CrossSave-v0.7-Windows
          path: dist/NFSMW-CrossSave-v0.7.exe
          if-no-files-found: error

      - name: Publish experimental v0.7.0 Windows release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.0
          name: NFSMW CrossSave v0.7.0 - Experimental PS2 Black Edition
          prerelease: true
          generate_release_notes: false
          body: |
            This build extends v0.5, retaining its PC and GameCube conversion and
            experimental GameCube region-transfer support.

            Added PS2 Black Edition (SLUS-21351) support:
            - PS2 Vita raw, PS2 native 20CM, and PSU import.
            - PC <-> PS2 and GameCube <-> PS2 conversions.
            - Vita raw, PS2 native game file, and PSU output.
            - For PSU output, supply an exported SLUS-21351 PSU as a template.
            - Existing cash override, backups and verification remain.

            WARNING: PS2 conversion is structurally verified with real user
            examples but has NOT been tested in-game. Make backups, and
            only test on copies. GameCube editions outside USA remain
            experimental. This is a prerelease.
          files: dist/NFSMW-CrossSave-v0.7.exe
          fail_on_unmatched_files: true
