name: Build and release Windows EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Python modules compile
        run: python -m py_compile converter_gui.pyw converter_core.py ps2_support.py ps2_layout.py

      - name: Run existing converter tests
        run: python self_test.py

      - name: Run PS2 Black Edition regression tests
        run: python -m unittest test_ps2 -v

      - name: Run GUI template and validation regression tests
        run: python -m unittest test_gui -v

      - name: Verify byte-exact integrated EF and PSU conversions
        run: python -m unittest test_integrated_ef -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build portable Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --clean --name NFSMW-CrossSave-v0.7.5 --icon assets/crosssave.ico --add-data "assets;assets" converter_gui.pyw
          if (!(Test-Path "dist/NFSMW-CrossSave-v0.7.5.exe")) { throw "EXE not produced" }

      - name: Upload EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-CrossSave-v0.7.5-Windows
          path: dist/NFSMW-CrossSave-v0.7.5.exe
          if-no-files-found: error

      - name: Publish stable v0.7.5 Windows release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.5
          name: NFSMW CrossSave v0.7.5 - PC / GameCube to PS Vita
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            Stable v0.7.5: Standalone Windows save converter for Need for Speed:
            Most Wanted (2005). Windows executable requires no Python or extra
            donor files.

            IN-GAME VERIFIED (user reports):
            - PC → PS Vita: extensionless profile output loads successfully.
            - GameCube → PS Vita: extensionless profile output loads successfully.
            - PC ↔ USA GameCube: career saves tested in-game.

            FOR PC / GAMECUBE → PS VITA:
            1. Choose PC → PS2 or GameCube → PS2 in CrossSave.
            2. Select your PC profile file or GameCube .gci career save.
            3. Choose "Vita port profile (extensionless)" for output.
            4. Click "Convert and verify". No external EF template is needed.
            5. Back up the Vita save folder before copying the new extensionless profile.

            OTHER FORMATS:
            - Native PS2 Black Edition (SLUS-21351) game-file and PSU archive
              output/import are supported experimentally, but in-game testing
              has not confirmed these conversion paths.
            - Other GameCube regional editions remain experimental.
            - PS2 / Vita → PC and GameCube conversion paths are experimental.

            Integrated original EF / BASLUS-21351-EF.psu templates are included
            unchanged with permission, reproducing the verified EF-based Vita
            serialization path. Advanced allows optional template overrides.
            Existing cash overrides, integrity checks and output backups remain.

            Versions v0.7.0/v0.7.1 used incorrect PS2 layouts. The v0.7.4
            neutral donor-free Vita profile was rejected as corrupt in-game;
            v0.7.5 uses the integrated original EF template instead.
            Always test new conversions on backed-up saves.
          files: dist/NFSMW-CrossSave-v0.7.5.exe
          overwrite_files: true
          fail_on_unmatched_files: true
